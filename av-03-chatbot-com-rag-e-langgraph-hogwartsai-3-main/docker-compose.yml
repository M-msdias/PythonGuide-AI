services:
  chatbot-rag:
    build: .
    container_name: chatbot-rag-langgraph
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PIP_DEFAULT_TIMEOUT=100
      - PIP_RETRIES=5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
services:
  python-guide-ai:
    build: .
    container_name: python-guide-ai
    network_mode: host
    env_file:
      - .env
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - ./data:/app/data
      - ~/.cache/huggingface:/root/.cache/huggingface:ro
    restart: unless-stopped